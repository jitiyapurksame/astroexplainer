<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exam Simulation · Astro Sketch Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0718; --panel: #1A1030; --panel-hi: #251642; --sun: #FF5DA2; --sun-soft: #FF8FC5;
    --dusk: #8B5CF6; --cream: #F5F0E6; --teal: #4DD8E0; --line: #3A2E5C; --danger: #FF6B6B; --gold: #FFD166;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);
    font-family:'Nunito',sans-serif; overscroll-behavior:none; touch-action:manipulation;}
  body{min-height:100vh; padding-bottom:40px;
    background:radial-gradient(ellipse 90% 55% at 15% -12%, rgba(255,93,162,0.25), transparent),
               radial-gradient(ellipse 70% 50% at 88% 6%, rgba(139,92,246,0.3), transparent), var(--bg);
    background-attachment: fixed;}
  .app{max-width:680px; margin:0 auto; padding:18px 16px 60px;}
  .back-link{color:#8A92C7; text-decoration:none; font-size:0.78rem; font-weight:700;}
  h1{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.5rem; margin:6px 0 2px;}
  .sub{font-size:0.82rem; color:#B9C0EA; margin-bottom:14px;}
  .panel{background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px;}
  .panel.glow{border-color:var(--teal); box-shadow:0 0 18px rgba(77,216,224,0.25);}
  .panel.good{border-color:var(--teal); background:rgba(77,216,224,0.1);}
  .panel.notyet{border-color:var(--sun-soft); background:rgba(255,93,162,0.08);}
  .rules{margin:8px 0 0; padding-left:20px; font-size:0.88rem; line-height:1.7;}
  .big-btn{width:100%; background:var(--teal); color:#08221f; border:none; border-radius:16px; padding:15px;
    font-family:'Baloo 2'; font-weight:800; font-size:1.05rem; cursor:pointer; margin-top:10px;}
  .big-btn:active{transform:scale(0.98);}
  .big-btn.secondary{background:var(--panel-hi); color:var(--cream); border:2px solid var(--line);}
  .btn-row{display:flex; gap:10px;} .btn-row .big-btn{margin-top:10px;}
  .bar{height:12px; background:var(--panel-hi); border-radius:999px; overflow:hidden; margin:10px 0 4px; border:1px solid var(--line);}
  .bar > div{height:100%; background:linear-gradient(90deg,var(--sun),var(--teal)); border-radius:999px;}
  .progress-text{font-size:0.8rem; color:#B9C0EA;}
  .clist{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-wrap:wrap; gap:8px;}
  .clist a{display:block; text-decoration:none; color:var(--cream); font-size:0.76rem; font-weight:700;
    border:1px solid var(--line); border-radius:12px; padding:7px 10px; background:var(--panel-hi);}
  .clist a.done{border-color:var(--teal); color:var(--teal);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .qcount{font-family:'Baloo 2'; font-weight:700; font-size:0.95rem;}
  .dots{display:flex; gap:6px; margin-bottom:12px;}
  .dot{flex:1; height:8px; border-radius:6px; background:var(--panel-hi); border:1px solid var(--line);}
  .dot.answered{background:var(--dusk); border-color:var(--dusk);} .dot.current{border-color:var(--teal); box-shadow:0 0 8px rgba(77,216,224,0.6);}
  .qtag{display:inline-block; background:var(--panel-hi); border:1px solid var(--line); border-radius:999px;
    font-size:0.72rem; font-weight:800; color:var(--sun-soft); padding:3px 10px; margin-bottom:8px;}
  .prompt{font-size:1rem; line-height:1.5; margin:4px 0 12px;}
  textarea{width:100%; min-height:150px; background:var(--panel); border:2px solid var(--line); border-radius:14px;
    padding:12px; color:var(--cream); font-family:'Nunito'; font-size:16px; line-height:1.5; resize:vertical;}
  textarea:focus{outline:none; border-color:var(--teal);}
  .score{font-family:'Baloo 2'; font-weight:800; font-size:2.4rem; line-height:1.1;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .chip{font-size:0.72rem; font-weight:700; padding:5px 10px; border-radius:999px; border:1px solid var(--line);}
  .chip.found{border-color:var(--teal); color:var(--teal); background:rgba(77,216,224,0.12);}
  .chip.missed{border-color:#565f9c; color:#B9C0EA;}
  details{margin-top:6px; font-size:0.8rem; color:#B9C0EA;} details p{white-space:pre-wrap; margin:6px 0 0;}
  .preview-tag{display:inline-block; background:var(--gold); color:#2a1d00; font-weight:800; font-size:0.7rem;
    border-radius:999px; padding:3px 10px; margin-left:8px; vertical-align:middle;}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(30px); background:var(--panel-hi);
    border:1px solid var(--teal); border-radius:14px; padding:10px 16px; font-size:0.82rem; opacity:0; pointer-events:none;
    transition:all .25s; z-index:40; max-width:90%;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(5,3,14,0.82); opacity:0; pointer-events:none; transition:opacity .3s;}
  .overlay.show{opacity:1; pointer-events:all;}
  .ocard{background:var(--panel); border:3px solid var(--gold); border-radius:24px; padding:28px 26px; text-align:center;
    max-width:320px; box-shadow:0 0 40px rgba(255,209,102,0.45); animation:pop .5s ease-out;}
  @keyframes pop{0%{transform:scale(.6); opacity:0;} 70%{transform:scale(1.06);} 100%{transform:scale(1); opacity:1;}}
  .ocard .big{font-size:3rem;} .ocard .code{font-family:'Baloo 2'; font-weight:800; color:var(--gold); font-size:1.8rem; margin:6px 0 2px;}
  .ocard .lbl{font-family:'Baloo 2'; font-weight:700; color:var(--sun-soft); margin-bottom:8px;}
  .ocard p{font-size:0.82rem; color:#B9C0EA; margin:0 0 16px; line-height:1.4;}
  .ocard button{background:var(--gold); color:#2a1d00; border:none; border-radius:12px; padding:10px 26px; font-family:'Baloo 2'; font-weight:800; font-size:0.95rem;}
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="index.html">← Hub</a>
  <h1 id="titleEl">🎯 Exam Simulation</h1>
  <div class="sub" id="subEl"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="ocard">
  <div class="big">🎯</div><div class="code">E.04</div><div class="lbl">Mission Ready!</div>
  <p id="ovMsg"></p><button id="ovClose">Awesome</button></div></div>

<script src="exam-data.js"></script>
<script>
/* Matching code below is copied from engine-template.html by tools/build_exam_page.py - never edit it here. */
/*__MATCHER__*/

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),3200); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function ssGet(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }

const params = new URLSearchParams(location.search);
const KEY = params.get('m');
const PREVIEW = params.get('preview') === '1';   // parent testing: runs the exam without saving anything
const CFG = Object.assign({ passPct:70, secondsPerQuestion:180, maxQuestions:8 }, (typeof ASTRO_EXAM_CONFIG !== 'undefined') ? ASTRO_EXAM_CONFIG : {});
const MOD = (typeof ASTRO_MODULES !== 'undefined') ? ASTRO_MODULES[KEY] : null;
const RUN_KEY = 'astro_examrun_' + KEY + (PREVIEW ? '_preview' : '');
const REC_KEY = 'astro_exam_' + KEY;
const view = document.getElementById('view');
let timerHandle = null;

function masteredIds(){
  return MOD.concepts.filter(c=>{ const s = lsGet('astro_'+c.id+'_support'); return s && s.cleanLevel3; }).map(c=>c.id);
}
function fmtTime(sec){ sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function questionCount(){ return Math.min(CFG.maxQuestions, Math.ceil(MOD.concepts.length/2)); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function conceptById(id){ return MOD.concepts.find(c=>c.id===id); }
function saveRun(run){ sessionStorage.setItem(RUN_KEY, JSON.stringify(run)); }

function render(){
  clearInterval(timerHandle);
  if(!MOD){ document.getElementById('subEl').textContent = ''; view.innerHTML = '<div class="panel">Exam not found. <a href="index.html" style="color:var(--teal)">Go back to the hub</a>.</div>'; return; }
  document.getElementById('titleEl').innerHTML = '🎯 ' + escapeHtml(MOD.title) + ' Exam' + (PREVIEW ? '<span class="preview-tag">PREVIEW · not saved</span>' : '');
  document.getElementById('subEl').textContent = 'Exam Simulation · E.04 Mission Ready';
  if(!MOD.complete){ view.innerHTML = '<div class="panel">🛠️ This module is not finished yet. The exam opens when every concept in it has been built.</div>'; return; }
  const run = ssGet(RUN_KEY);
  if(run && run.result) return renderResults(run);
  if(run && Date.now() >= run.endAt) return finishExam(run, true);
  if(run) return renderQuestion(run);
  renderIntro();
}

function renderIntro(){
  const done = masteredIds();
  const total = MOD.concepts.length;
  const unlocked = PREVIEW || done.length === total;
  const rec = lsGet(REC_KEY);
  const n = questionCount(), mins = Math.round(n*CFG.secondsPerQuestion/60);
  if(!unlocked){
    view.innerHTML = `
      <div class="panel">
        <strong>🔒 Exam locked</strong>
        <div class="progress-text" style="margin-top:6px">Get a clean E.03 pass (no hints) on every concept in this module to unlock it.</div>
        <div class="bar"><div style="width:${Math.round(100*done.length/total)}%"></div></div>
        <div class="progress-text"><strong>${done.length}/${total}</strong> concepts mastered</div>
        <ul class="clist">${MOD.concepts.map(c=>`<li><a class="${done.includes(c.id)?'done':''}" href="${c.href}">${done.includes(c.id)?'✓':'🔒'} ${c.icon} ${escapeHtml(c.title)}</a></li>`).join('')}</ul>
      </div>`;
    return;
  }
  view.innerHTML = `
    <div class="panel glow">
      <strong>${PREVIEW ? '👀 Preview mode' : '✅ Exam unlocked!'}</strong>
      <ul class="rules">
        <li><strong>${n} questions</strong>, one from ${n} different concepts, picked at random</li>
        <li>Take your time: you have about <strong>${mins} minutes</strong> in total. There is no clock on screen, and the exam hands itself in when the time is up</li>
        <li>No hints, no starters, no word pills</li>
        <li>You need <strong>${CFG.passPct}%</strong> of the marks to earn <strong>E.04 Mission Ready</strong></li>
        <li>You can retry as many times as you like (new questions each time)</li>
      </ul>
      ${rec ? `<div class="progress-text" style="margin-top:10px">Attempts: ${rec.attempts||0} · Best: <strong>${rec.bestPct}%</strong>${rec.passed ? ' · 🎯 Mission Ready' : ''}</div>` : ''}
      <button class="big-btn" id="startBtn">🚀 Start the exam</button>
    </div>`;
  document.getElementById('startBtn').onclick = startExam;
}

function startExam(){
  const ids = shuffle(MOD.concepts.map(c=>c.id)).slice(0, questionCount());
  saveRun({ ids, answers:{}, idx:0, endAt: Date.now() + ids.length*CFG.secondsPerQuestion*1000, startedAt: Date.now() });
  render();
}

function renderQuestion(run){
  const id = run.ids[run.idx], c = conceptById(id);
  const n = run.ids.length, last = run.idx === n-1;
  const marks = c.markPoints.length;
  view.innerHTML = `
    <div class="topbar"><div class="qcount">Question ${run.idx+1} of ${n}</div></div>
    <div class="dots">${run.ids.map((x,i)=>`<div class="dot ${(run.answers[x]||'').trim()?'answered':''} ${i===run.idx?'current':''}"></div>`).join('')}</div>
    <div class="panel">
      <span class="qtag">${c.icon} ${escapeHtml(c.title)} · ${marks} mark${marks===1?'':'s'}</span>
      <p class="prompt">${escapeHtml(c.prompt)}</p>
      <textarea id="answerBox" placeholder="Write your answer — no hints this time."></textarea>
    </div>
    <div class="btn-row">
      ${run.idx>0 ? '<button class="big-btn secondary" id="backBtn">← Back</button>' : ''}
      <button class="big-btn" id="nextBtn">${last ? '✅ Hand in exam' : 'Next →'}</button>
    </div>`;
  const box = document.getElementById('answerBox');
  box.value = run.answers[id] || '';
  box.oninput = ()=>{ run.answers[id] = box.value; saveRun(run); const dots = view.querySelectorAll('.dot'); if(dots[run.idx]) dots[run.idx].classList.toggle('answered', !!box.value.trim()); };
  const go = d => { run.answers[id] = box.value; run.idx += d; saveRun(run); renderQuestion(run); };
  if(run.idx>0) document.getElementById('backBtn').onclick = ()=>go(-1);
  document.getElementById('nextBtn').onclick = ()=>{
    if(!last) return go(1);
    run.answers[id] = box.value; saveRun(run);
    const blanks = run.ids.filter(x=>!(run.answers[x]||'').trim()).length;
    const msg = blanks ? `You have ${blanks} unanswered question${blanks===1?'':'s'}. Hand in the exam now?` : 'Hand in your exam now?';
    if(confirm(msg)) finishExam(run, false);
  };
  // Quiet time limit: nothing is shown on screen. The exam simply hands itself in when the time is up.
  const tick = ()=>{
    if(run.endAt - Date.now() <= 0){ clearInterval(timerHandle); run.answers[run.ids[run.idx]] = box.value; finishExam(run, true); }
  };
  tick(); timerHandle = setInterval(tick, 500);
}

function finishExam(run, timedOut){
  clearInterval(timerHandle);
  const items = run.ids.map(id=>{
    const c = conceptById(id), text = run.answers[id] || '';
    const r = checkMarkPoints(text, c.markPoints);
    return { id, earned:r.hits, total:r.total, found:r.results.filter(x=>x.found).map(x=>x.label), missed:r.results.filter(x=>!x.found).map(x=>x.label), text };
  });
  const earned = items.reduce((a,b)=>a+b.earned,0), total = items.reduce((a,b)=>a+b.total,0);
  const pct = total ? Math.round(100*earned/total) : 0;
  const passed = pct >= CFG.passPct;
  run.result = { items, earned, total, pct, passed, timedOut: !!timedOut };
  let firstPass = false;
  if(!PREVIEW){
    const prev = lsGet(REC_KEY) || { attempts:0, bestPct:0, passed:false, history:[] };
    firstPass = passed && !prev.passed;
    const rec = {
      attempts: (prev.attempts||0) + 1, lastPct: pct, bestPct: Math.max(prev.bestPct||0, pct),
      passed: !!(prev.passed || passed), passedDate: prev.passedDate || (passed ? new Date().toISOString() : null),
      history: ((prev.history||[]).concat([{ date:new Date().toISOString(), pct, earned, total }])).slice(-10)
    };
    localStorage.setItem(REC_KEY, JSON.stringify(rec));
  }
  run.firstPass = firstPass;
  saveRun(run);
  renderResults(run);
}

function renderResults(run){
  const r = run.result;
  const rec = lsGet(REC_KEY);
  view.innerHTML = `
    <div class="panel ${r.passed?'good':'notyet'}">
      ${r.timedOut ? '<div class="progress-text" style="margin-bottom:6px">⏱ Time is up — your answers so far were marked.</div>' : ''}
      <div class="score">${r.earned}/${r.total} marks · ${r.pct}%</div>
      <div style="margin-top:6px; font-weight:800; font-family:'Baloo 2'; font-size:1.1rem">
        ${r.passed ? '🎯 Mission Ready! You passed.' : `Not yet — you need ${CFG.passPct}% for Mission Ready.`}
      </div>
      <div class="progress-text" style="margin-top:6px">${r.passed
        ? (PREVIEW ? 'Preview only, nothing was saved.' : 'Every concept in this module now shows E.04 · Mission Ready.')
        : 'Look at the missed ideas below, practise those concepts, then try again with new questions.'}
        ${(!PREVIEW && rec) ? ` · Best so far: <strong>${rec.bestPct}%</strong> · Attempts: ${rec.attempts}` : ''}</div>
    </div>
    ${r.items.map(it=>{ const c = conceptById(it.id); return `
      <div class="panel">
        <strong>${c.icon} ${escapeHtml(c.title)}</strong> <span class="progress-text">· ${it.earned}/${it.total}</span>
        <div class="chips">${it.found.map(l=>`<span class="chip found">✓ ${escapeHtml(l)}</span>`).join('')}${it.missed.map(l=>`<span class="chip missed">✗ ${escapeHtml(l)}</span>`).join('')}</div>
        <details><summary>My answer</summary><p>${it.text.trim() ? escapeHtml(it.text) : '(no answer)'}</p></details>
        ${it.missed.length ? `<a href="${c.href}" style="color:var(--teal); font-size:0.8rem; font-weight:700; text-decoration:none; display:inline-block; margin-top:8px">Practise ${escapeHtml(c.title)} →</a>` : ''}
      </div>`; }).join('')}
    <div class="btn-row">
      <button class="big-btn secondary" id="againBtn">🔁 Try again</button>
      <button class="big-btn" id="hubBtn">Back to hub</button>
    </div>`;
  document.getElementById('againBtn').onclick = ()=>{ sessionStorage.removeItem(RUN_KEY); render(); };
  document.getElementById('hubBtn').onclick = ()=>{ location.href = 'index.html'; };
  if(run.firstPass){
    run.firstPass = false; saveRun(run);
    document.getElementById('ovMsg').textContent = `You passed the ${MOD.title} exam with ${r.pct}%. Every concept in this module is now Mission Ready.`;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('ovClose').onclick = ()=>document.getElementById('overlay').classList.remove('show');
  }
}
render();
</script>
</body>
</html>
